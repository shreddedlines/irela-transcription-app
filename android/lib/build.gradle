plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.whispercpp'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // When set, builds whisper.android against the version located
                // at GGML_HOME instead of the copy bundled with whisper.cpp.
                if (
                    project.hasProperty('GGML_HOME') &&
                    project.findProperty('GGML_CLBLAST') == 'ON'
                ) {
                    // Turning on CLBlast requires GGML_HOME
                    arguments "-DGGML_HOME=${project.property('GGML_HOME')}",
                         "-DGGML_CLBLAST=ON",
                         "-DOPENCL_LIB=${project.property('OPENCL_LIB')}",
                         "-DCLBLAST_HOME=${project.property('CLBLAST_HOME')}",
                         "-DOPENCL_ROOT=${project.property('OPENCL_ROOT')}",
                         "-DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH",
                         "-DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH"
                } else if (project.hasProperty('GGML_HOME')) {
                    arguments "-DGGML_HOME=${project.property('GGML_HOME')}"
                }

            }
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    // The native whisper.cpp/ggml build lives in THIS module,
                    // so this is the only place the override has any effect.
                    // Without it AGP configures CMAKE_BUILD_TYPE=Debug, and
                    // jni/whisper/CMakeLists.txt gates -O3 behind
                    // `NOT CMAKE_BUILD_TYPE STREQUAL "Debug"` -- so every ggml
                    // kernel compiled at -O0. Measured effect of fixing it on
                    // the 30.02 s clip: 70.8 s -> ~11.2 s inference (~6.3x).
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }

        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    ndkVersion "27.2.12479018"
    externalNativeBuild {
        cmake {
            path = file("src/main/jni/whisper/CMakeLists.txt")
        }
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'

    testImplementation 'junit:junit:4.13.2'
}